<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-wan" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fbbf24"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#bg)"/>

  <!-- Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.3"/>
  </pattern>
  <rect width="800" height="560" fill="url(#grid)"/>

  <!-- Title -->
  <text x="400" y="30" font-family="monospace" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Topologia de Rede — Homelab</text>
  <text x="400" y="46" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Atualizado: Outubro 2026</text>

  <!-- === INTERNET (WAN) === -->
  <rect x="300" y="55" width="200" height="45" rx="25" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="400" y="78" font-family="monospace" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="bold">☁  Internet (WAN)</text>
  <text x="400" y="92" font-family="monospace" font-size="8" fill="#fbbf24" text-anchor="middle">[IP-PUBLICA] — Vodafone PT</text>

  <!-- Arrow Internet to ISP Router -->
  <line x1="400" y1="100" x2="400" y2="125" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-wan)"/>

  <!-- ISP Router -->
  <rect x="320" y="127" width="160" height="40" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="145" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Router Vodafone</text>
  <text x="400" y="157" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">Portas 80/443 abertas</text>

  <!-- Arrow ISP Router to Internal Network -->
  <line x1="400" y1="167" x2="400" y2="200" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- === INTERNAL NETWORK === -->
  <rect x="80" y="202" width="640" height="220" rx="8" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="95" y="217" font-family="monospace" font-size="9" fill="#34d399">REDE INTERNA</text>

  <!-- Qosmio Server -->
  <rect x="140" y="235" width="200" height="60" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="240" y="257" font-family="monospace" font-size="12" fill="#34d399" text-anchor="middle" font-weight="bold">🖥  Qosmio Server</text>
  <text x="240" y="288" font-family="monospace" font-size="8" fill="#34d399" text-anchor="middle">Nextcloud · Samba · Docker</text>

  <!-- Windows PC -->
  <rect x="460" y="235" width="200" height="60" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="560" y="257" font-family="monospace" font-size="12" fill="#34d399" text-anchor="middle" font-weight="bold">💻  Windows PC</text>
  <text x="560" y="288" font-family="monospace" font-size="8" fill="#34d399" text-anchor="middle">Gestão · SSH · Scripts</text>

  <!-- Arrow between servers -->
  <line x1="340" y1="265" x2="458" y2="265" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- HP Local -->
  <rect x="140" y="310" width="200" height="55" rx="6" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1"/>
  <text x="240" y="330" font-family="monospace" font-size="11" fill="#34d399" text-anchor="middle" font-weight="bold">🖧  HP Workstation</text>
  <text x="240" y="358" font-family="monospace" font-size="8" fill="#34d399" text-anchor="middle">Terminal · Git</text>

  <!-- Arrow Qosmio to HP -->
  <line x1="340" y1="337" x2="458" y2="337" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Services labels -->
  <text x="400" y="400" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">SERVIÇOS</text>

  <rect x="100" y="410" width="120" height="25" rx="4" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1"/>
  <text x="160" y="427" font-family="monospace" font-size="8" fill="#a78bfa" text-anchor="middle">Nextcloud</text>

  <rect x="235" y="410" width="90" height="25" rx="4" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1"/>
  <text x="280" y="427" font-family="monospace" font-size="8" fill="#a78bfa" text-anchor="middle">Samba (Z:)</text>

  <rect x="340" y="410" width="110" height="25" rx="4" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1"/>
  <text x="395" y="427" font-family="monospace" font-size="8" fill="#a78bfa" text-anchor="middle">Docker / Portainer</text>

  <rect x="465" y="410" width="90" height="25" rx="4" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1"/>
  <text x="510" y="427" font-family="monospace" font-size="8" fill="#a78bfa" text-anchor="middle">Pi-hole</text>

  <rect x="570" y="410" width="90" height="25" rx="4" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1"/>
  <text x="615" y="427" font-family="monospace" font-size="8" fill="#a78bfa" text-anchor="middle">Cloudflare</text>

  <!-- Legend -->
  <text x="30" y="545" font-family="monospace" font-size="7" fill="#64748b">🟡 WAN  🟢 Rede Interna  🟣 Serviços</text>
</svg>